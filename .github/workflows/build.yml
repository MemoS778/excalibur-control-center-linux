name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev
      - name: Build
        run: make -j2
      - name: Test profile format
        run: make test
